<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px 56px;
        background:
          radial-gradient(900px 360px at 8% -10%, rgba(196, 92, 50, 0.22), transparent 55%),
          radial-gradient(700px 300px at 100% 10%, rgba(63, 111, 98, 0.18), transparent 50%),
          #f3e6d4;
        color: #241c14;
        font-family: "Iowan Old Style", Palatino, Georgia, serif;
      }
      .mark { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
      h1 {
        margin: 0;
        font-size: 92px;
        line-height: 0.92;
        letter-spacing: -0.04em;
      }
      p {
        margin: 18px 0 0;
        max-width: 18em;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 28px;
        color: #6e5848;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 22px;
        color: #6e5848;
      }
    </style>
  </head>
  <body>
    <div class="mark">sillyapps.co</div>
    <div>
      <h1>Small free apps.</h1>
      <p>Edmund Lim. Lazy Man's Reminders, UsageWidget, and Stage Wand.</p>
    </div>
    <div class="foot">
      <span>Not a store. A list.</span>
      <span>sillyapps.co</span>
    </div>
  </body>
</html>
